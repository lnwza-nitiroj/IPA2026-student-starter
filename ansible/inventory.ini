[routers]
target

[routers:vars]
# The router address comes from the "router" extra variable supplied by
# app/backends/ansible.py. Credentials are read from the environment at
# runtime (ROUTER_USER / ROUTER_PASS) and are never stored in the repo.
ansible_host={{ router }}
ansible_user={{ lookup('ansible.builtin.env', 'ROUTER_USER') }}
ansible_password={{ lookup('ansible.builtin.env', 'ROUTER_PASS') }}
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_network_cli_ssh_type=paramiko
ansible_host_key_checking=false
ansible_paramiko_host_key_checking=false
ansible_paramiko_look_for_keys=false
